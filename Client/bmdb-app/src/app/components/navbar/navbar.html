<nav class="border-b border-line bg-paper">
	@if (auth.isAuth) {
	<div class="mx-auto max-w-6xl px-6">
		<div class="flex h-20 items-center justify-between">
			<!-- Wordmark -->
			<a [routerLink]="['/movies']" class="group flex items-baseline gap-1">
				<span
					class="font-display text-2xl font-medium tracking-tight text-ink transition-opacity duration-200 group-hover:opacity-70"
				>
					BMDb
				</span>
				<span class="h-1.5 w-1.5 translate-y-[-2px] bg-accent"></span>
			</a>

			<!-- Desktop nav -->
			<div class="hidden items-center gap-10 md:flex">
				<a
					[routerLink]="['/movies']"
					routerLinkActive="text-ink after:w-full"
					class="relative text-sm uppercase tracking-[0.15em] text-ink-soft transition-colors duration-200 hover:text-ink after:absolute after:-bottom-1.5 after:left-0 after:h-px after:w-0 after:bg-accent after:transition-all after:duration-200"
				>
					Collection
				</a>
				<a
					[routerLink]="['/search']"
					routerLinkActive="text-ink after:w-full"
					class="relative text-sm uppercase tracking-[0.15em] text-ink-soft transition-colors duration-200 hover:text-ink after:absolute after:-bottom-1.5 after:left-0 after:h-px after:w-0 after:bg-accent after:transition-all after:duration-200"
				>
					Search
				</a>
				<app-theme-toggle />
				<button
					(click)="logout()"
					class="border border-ink px-4 py-1.5 text-sm uppercase tracking-[0.15em] text-ink transition-all duration-200 hover:-translate-y-px hover:bg-ink hover:text-paper"
				>
					Sign out
				</button>
			</div>

			<!-- Mobile toggle -->
			<div class="flex items-center gap-4 md:hidden">
				<app-theme-toggle />
				<button
					(click)="toggleMobileMenu()"
					class="text-sm uppercase tracking-[0.15em] text-ink"
				>
					{{ mobileMenuOpen ? 'Close' : 'Menu' }}
				</button>
			</div>
		</div>

		<!-- Mobile menu -->
		@if (mobileMenuOpen) {
		<div class="flex flex-col gap-5 border-t border-line py-6 md:hidden">
			<a
				[routerLink]="['/movies']"
				(click)="closeMobileMenu()"
				class="text-sm uppercase tracking-[0.15em] text-ink-soft hover:text-ink"
				>Collection</a
			>
			<a
				[routerLink]="['/search']"
				(click)="closeMobileMenu()"
				class="text-sm uppercase tracking-[0.15em] text-ink-soft hover:text-ink"
				>Search</a
			>
			<button
				(click)="logout()"
				class="self-start border border-ink px-4 py-1.5 text-sm uppercase tracking-[0.15em] text-ink hover:bg-ink hover:text-paper"
			>
				Sign out
			</button>
		</div>
		}
	</div>
	}
</nav>
