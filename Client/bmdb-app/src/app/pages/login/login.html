<div class="relative grid min-h-screen grid-cols-1 lg:grid-cols-12">
	<div class="absolute right-6 top-6 z-10">
		<app-theme-toggle />
	</div>
	<!-- Editorial left panel -->
	<div
		class="hidden flex-col justify-between border-r border-line bg-paper-2 px-12 py-16 lg:col-span-5 lg:flex"
	>
		<div class="flex items-baseline gap-1">
			<span class="font-display text-2xl font-medium tracking-tight text-ink"
				>BMDb</span
			>
			<span class="h-1.5 w-1.5 translate-y-[-2px] bg-accent"></span>
		</div>
		<div class="max-w-md">
			<h1
				class="font-display text-6xl font-light leading-[0.95] tracking-tight text-ink"
			>
				A quiet<br />library of<br />cinema.
			</h1>
			<p class="mt-8 max-w-prose leading-relaxed text-ink-soft">
				Enter the access code we sent to your inbox. No passwords, no
				clutter — just the films.
			</p>
		</div>
		<p class="text-xs uppercase tracking-[0.25em] text-ink-soft">
			Est. MMXXVI
		</p>
	</div>

	<!-- Form -->
	<div class="flex items-center justify-center px-6 py-16 lg:col-span-7">
		<div class="w-full max-w-sm">
			<p class="mb-3 text-xs uppercase tracking-[0.25em] text-accent">
				Authorization
			</p>
			<h2
				class="font-display text-4xl font-light tracking-tight text-ink"
			>
				Sign in
			</h2>

			<form
				[formGroup]="form"
				(ngSubmit)="onSubmit()"
				class="mt-12 space-y-10"
			>
				<div>
					<label
						for="accessCode"
						class="block text-xs uppercase tracking-[0.18em] text-ink-soft"
						>Access code</label
					>
					<input
						id="accessCode"
						type="text"
						formControlName="accessCode"
						class="mt-3 block w-full border-0 border-b border-line bg-transparent pb-2 font-display text-2xl tracking-tight text-ink placeholder:text-line focus:border-accent focus:outline-none focus:ring-0"
						placeholder="e.g. 3f9a2c"
						autocomplete="off"
					/>
					<div
						*ngIf="form.get('accessCode')?.invalid && form.get('accessCode')?.touched"
						class="mt-2 text-xs text-accent"
					>
						Access code is required.
					</div>
				</div>

				<button
					type="submit"
					class="w-full bg-ink py-4 text-sm uppercase tracking-[0.2em] text-paper transition-all duration-200 hover:-translate-y-px disabled:cursor-not-allowed disabled:opacity-40"
					[disabled]="form.invalid"
				>
					Enter
				</button>
			</form>
		</div>
	</div>
</div>
